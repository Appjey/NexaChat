name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # v2 (config migrated to .golangci.yaml, version: "2"). Keep in sync
          # with the Docker image used for local runs, see README "Backend linting".
          version: v2.15.0
          args: --timeout=5m
          working-directory: ./backend

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: messenger_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      # DB_URL points the repository tests (internal/repositories/*_db_test.go)
      # at the Postgres service above; without it they skip themselves.
      - name: Run tests with race detector
        env:
          DB_URL: postgres://test:test@localhost:5432/messenger_test?sslmode=disable
          JWT_SECRET: test-secret-key-with-at-least-32-characters-long
          PORT: 8080
          ALLOWED_ORIGINS: http://localhost:8080
        run: go test -v -race ./...

      - name: Generate coverage report
        env:
          DB_URL: postgres://test:test@localhost:5432/messenger_test?sslmode=disable
          JWT_SECRET: test-secret-key-with-at-least-32-characters-long
          PORT: 8080
          ALLOWED_ORIGINS: http://localhost:8080
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.out
          flags: unittests
          fail_ci_if_error: false

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Build
        run: go build -v -o messenger ./cmd/server

      - name: Test executable
        run: |
          file messenger
          ls -lh messenger

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Vitest
        run: npm test

      - name: Unused dependencies (knip)
        run: npm run knip -- --dependencies

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker-backend:
    name: Docker Build Backend
    runs-on: ubuntu-latest
    needs: [lint-backend, test-backend, build-backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # CI validates the image locally. release.yml publishes the deployable
      # messenger-backend image on version tags.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          load: true
          tags: nexa-ci-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-frontend:
    name: Docker Build Frontend
    runs-on: ubuntu-latest
    needs: [lint-frontend, test-frontend, build-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Publishing happens only in release.yml; CI needs no GHCR permission.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          load: true
          tags: nexa-ci-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Note: production deploy moved to .github/workflows/release.yml, which runs
  # on `git tag v*`. Previously a `deploy` job lived here and ran on every push
  # to main; combined with release.yml it caused two concurrent
  # `docker compose pull` invocations on the same VM, and containerd would fail
  # one of them with "unable to lease content: lease does not exist".
  # Tag-only releases also remove surprise deploys from accidental main pushes.

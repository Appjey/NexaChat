# Release build (CI half). Triggered by `git tag v<version> && git push --tags`.
# Produces every artefact of a release and nothing else — no server is touched:
#
#   android       signed APK + its .sha256 → GitHub Release (created here)
#   desktop-macos macOS arm64 DMG          → same GitHub Release
#   images        backend + frontend Docker images → GHCR (:<version> and :latest)
#
# Shipping those artefacts to an environment (deploying the images to the VM
# and registering the APK in the backend so clients see the update banner) is
# the CD half: .github/workflows/deploy.yml, run by hand for a given version.
#
# Required secrets:
#   ANDROID_KEYSTORE_BASE64   — `base64 -w0 release.jks` of your keystore file
#   ANDROID_KEYSTORE_PASSWORD — keystore password
#   ANDROID_KEY_ALIAS         — key alias inside the keystore
#   ANDROID_KEY_PASSWORD      — password for that specific key
#   GOOGLE_SERVICES_JSON_BASE64 — Firebase config for the Android build

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # create the GitHub Release + upload assets
  packages: write  # push images to ghcr.io

jobs:
  version:
    name: Parse version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.ver.outputs.name }}
      code: ${{ steps.ver.outputs.code }}
    steps:
      - name: Parse version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          # Android versionCode must be a monotonic integer: the run number is.
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Releasing v$TAG (versionCode=$GITHUB_RUN_NUMBER)"

  android:
    name: Android APK + GitHub Release
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history for changelog derivation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Capacitor CLI 8.x requires Node >= 22.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Decode signing keystore
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_ENV"

      - name: Bump versionCode / versionName
        run: |
          cd frontend/android/app
          # Regex-based so we don't depend on the previous value's exact text.
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ needs.version.outputs.code }}/" build.gradle
          sed -i -E 's/versionName "[^"]+"/versionName "${{ needs.version.outputs.name }}"/' build.gradle
          echo "After bump:"
          grep -E 'versionCode|versionName' build.gradle

      # google-services.json is gitignored (per-environment Firebase keys); without
      # it the com.google.gms.google-services gradle plugin doesn't apply and the
      # FCM-backed @capacitor/push-notifications plugin throws
      # "Default FirebaseApp is not initialized" at process start. Restored from
      # a base64 secret before `cap sync`, which bundles it into the build.
      - name: Restore google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d \
            > frontend/android/app/google-services.json
          test -s frontend/android/app/google-services.json
          jq -e .project_info.project_id frontend/android/app/google-services.json > /dev/null

      - name: Install web deps + sync Android
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          # The committed version is a baseline, the tag is the source of truth.
          npm version "${{ needs.version.outputs.name }}" --no-git-tag-version --allow-same-version
          npm run sync:android

      - name: Build signed APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Compute SHA-256, rename APK
        id: apk
        run: |
          APK=frontend/android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::Signed APK not produced at $APK. Check keystore secrets." >&2
            ls frontend/android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          RENAMED="messenger-${{ needs.version.outputs.name }}.apk"
          cp "$APK" "$RENAMED"
          # Published next to the APK so deploy.yml can register the release in
          # the backend without rebuilding or re-downloading anything.
          sha256sum "$RENAMED" > "$RENAMED.sha256"
          echo "renamed=$RENAMED" >> "$GITHUB_OUTPUT"
          echo "Built $RENAMED ($(stat -c%s "$RENAMED") bytes): $(cat "$RENAMED.sha256")"

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # actions/checkout can land the tag as a lightweight ref (annotation
          # dropped) — re-fetch the tag object and read its message only if it's
          # truly annotated. Curated notes (git tag -a vX.Y.Z -m "...") flow to
          # the GitHub Release body and the in-app changelog; a lightweight tag
          # falls back to the commit log.
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null || true
          LOG=""
          if [ "$(git cat-file -t "$TAG" 2>/dev/null)" = "tag" ]; then
            LOG=$(git for-each-ref "refs/tags/${TAG}" --format='%(contents)')
          fi
          if [ -z "$LOG" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              LOG=$(git log --pretty=format:"- %s" --no-merges "$PREV_TAG"..HEAD)
            else
              LOG=$(git log --pretty=format:"- %s" --no-merges HEAD | head -30)
            fi
          fi
          # Bound to 7 KB — backend cap is 8 KB on the changelog field.
          LOG=$(echo "$LOG" | head -c 7000)
          {
            echo "log<<CHANGELOG_EOF"
            echo "$LOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release + upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.version.outputs.name }}
          body: ${{ steps.changelog.outputs.log }}
          files: |
            ${{ steps.apk.outputs.renamed }}
            ${{ steps.apk.outputs.renamed }}.sha256
          fail_on_unmatched_files: true

  # macOS desktop client (arm64 DMG). Must run on an Apple Silicon runner;
  # `needs: android` guarantees the GitHub Release already exists, so the two
  # jobs never race to create it. No Developer ID secrets are configured — the
  # bundle is ad-hoc signed by electron/scripts/adhoc-sign.js, so first launch
  # on another Mac needs the Gatekeeper override described in the README (no notarization).
  desktop-macos:
    name: macOS DMG
    needs: [version, android]
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/electron/package-lock.json

      - name: Build desktop web bundle
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm run sync:desktop

      - name: Build DMG
        working-directory: frontend/electron
        run: |
          # --ignore-scripts skips electron's binary-download postinstall; that's
          # fine — electron-builder fetches its own Electron dist for packaging,
          # and CI never runs `electron .`.
          npm ci --no-audit --no-fund --ignore-scripts
          npm version "${{ needs.version.outputs.name }}" --no-git-tag-version --allow-same-version
          npx electron-builder --mac dmg --arm64

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.name }}
          files: frontend/electron/release/NexaChat-${{ needs.version.outputs.name }}-mac-arm64.dmg
          fail_on_unmatched_files: true

  images:
    name: Docker images → GHCR
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner (GHCR requires lowercase)
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/messenger-backend:${{ needs.version.outputs.name }}
            ghcr.io/${{ steps.owner.outputs.value }}/messenger-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build + push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/messenger-frontend:${{ needs.version.outputs.name }}
            ghcr.io/${{ steps.owner.outputs.value }}/messenger-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

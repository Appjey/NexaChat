services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: nothing-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-messenger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-messenger}
    # Published on the host (dev only; the prod compose keeps Postgres
    # internal) so the backend can run outside Docker — `go run ./cmd/server`
    # or the IDE run configuration — against the compose database.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-messenger} -d ${POSTGRES_DB:-messenger}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO S3-Compatible Object Storage
  # The bucket is created by the backend on startup (HeadBucket -> CreateBucket,
  # idempotent); there is no separate init job any more.
  minio:
    # `minio/minio` and `minio/mc` were deleted from Docker Hub in September 2026
    # and quay.io no longer serves anonymous pulls, so the stack could not start
    # on a machine without cached images. Chainguard rebuilds MinIO from source
    # (same `minio` binary, same /data layout, honours MINIO_ROOT_PASSWORD_FILE)
    # and serves it anonymously. Pinned by digest because the free tier only
    # publishes the `latest` tag; to bump, run
    #   docker buildx imagetools inspect cgr.dev/chainguard/minio:latest
    # and paste the top-level (multi-arch index) digest here.
    # Pinned: RELEASE.2026-09-22T19-25-18Z, image built 2026-10-21.
    image: cgr.dev/chainguard/minio:latest@sha256:ad134b2dd572ae0d989d6807c3e45516cc75a34883a8021db2ff04be5d1d496a
    container_name: nothing-minio
    restart: unless-stopped
    # The image defaults to uid 65532 (nonroot); the old minio/minio image ran
    # as root and the existing minio_data volume is root-owned. Keep running as
    # root so the volume carries over untouched (see ops/OBJECT-STORAGE.md to
    # switch to nonroot with a one-time chown instead).
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:-http://localhost:9001}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    # No `mc`/curl/grep dependency (the image has none): bash builtins only,
    # /dev/tcp HTTP probe of MinIO's liveness endpoint expecting a 200.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ \"$$status\" == *' 200 '* ]]"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Go Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-nothing-backend:latest}
    container_name: nothing-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_URL: postgres://${POSTGRES_USER:-messenger}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-messenger}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
      PORT: 8080
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      # S3/MinIO configuration
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-http://minio:9000}
      STORAGE_S3_PUBLIC_ENDPOINT: ${STORAGE_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-messenger-uploads}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      STORAGE_S3_USE_SSL: ${STORAGE_S3_USE_SSL:-false}
      STORAGE_S3_PRESIGNED_EXPIRY: ${STORAGE_S3_PRESIGNED_EXPIRY:-3600}
      # VAPID keys for Web Push Notifications
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Optional: gates /api/admin/* endpoints (release registration).
      # Empty value disables admin endpoints with 503 rather than 401.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    healthcheck:
      test: ["CMD", "/app/messenger", "-health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

  # pgAdmin (optional, for development)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nothing-pgadmin
    restart: unless-stopped
    profiles:
      - dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  # Nginx Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Must match STORAGE_S3_PUBLIC_ENDPOINT of the backend: the CSP in the
        # built index.html only allows attachment downloads from this origin.
        VITE_FILES_ORIGIN: ${STORAGE_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
    image: ${FRONTEND_IMAGE:-nothing-frontend:latest}
    container_name: nothing-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORT:-80}:80"

volumes:
  postgres_data:
  pgadmin_data:
  minio_data:
